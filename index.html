<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/anf-logo.png" />
    <link rel="apple-touch-icon" href="/anf-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1A33" />
    <link rel="canonical" href="https://anfconsult.com/" />

    <title>ANF Consulting · Clarity. Integration. Automation.</title>
    <meta name="description" content="ANF Consulting is a growth partner for professionals and small businesses ready to invest in smart marketing, modern infrastructure, and practical AI. One partner, one roadmap, one team." />

    <meta property="og:site_name" content="ANF Consulting" />
    <meta property="og:title" content="ANF Consulting · Clarity. Integration. Automation." />
    <meta property="og:description" content="Smart marketing, modern infrastructure, and practical AI, built for professionals and small businesses ready to move through change with confidence. One partner, one roadmap, one team." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://anfconsult.com/" />
    <meta property="og:image" content="https://anfconsult.com/anf-logo.png" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ANF Consulting · Clarity. Integration. Automation." />
    <meta name="twitter:description" content="Smart marketing, modern infrastructure, and practical AI. One partner, one roadmap, one team." />

    <!--
      Structured data. Tells Google what this business is, where it works, and how
      to reach it, which is what powers the knowledge panel and local results.
      Lives in index.html (not the React app) so crawlers see it without running JS.
      No street address is claimed here because ANF works remotely across the region.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "@id": "https://anfconsult.com/#business",
      "name": "ANF Consulting",
      "url": "https://anfconsult.com",
      "logo": "https://anfconsult.com/anf-logo.png",
      "image": "https://anfconsult.com/anf-logo.png",
      "slogan": "Clarity. Integration. Automation.",
      "description": "ANF Consulting builds custom business systems: websites, CRMs, client portals, automation, and practical AI training, designed around how each business actually works.",
      "telephone": "+1-573-276-9756",
      "email": "admin@anfconsult.com",
      "priceRange": "$$",
      "founder": {
        "@type": "Person",
        "name": "Andrew Fowler",
        "jobTitle": "Founder"
      },
      "address": {
        "@type": "PostalAddress",
        "addressRegion": "OH",
        "addressCountry": "US"
      },
      "areaServed": [
        { "@type": "State", "name": "Ohio" },
        { "@type": "Country", "name": "United States" }
      ],
      "knowsAbout": [
        "Custom CRM development",
        "Small business websites",
        "Client portals",
        "Business process automation",
        "Practical AI training",
        "Real estate technology",
        "Field service software"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website design and build" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom CRM and client portal" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Business automation" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI training and education" } }
        ]
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load font CSS without blocking render: preload as style, then flip to a
         stylesheet on load. font-display:swap (in the URL) shows fallback text meanwhile. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
