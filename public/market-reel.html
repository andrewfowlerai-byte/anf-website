<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elli Group — East Side Market Update Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================================
     Numbers live in the CONFIG block near the bottom. They are real figures
     pulled from Redfin (spring 2026), but small luxury suburbs are noisy.
     Confirm against Yes-MLS for a clean same-month set before posting.
     ========================================================================= */
  :root {
    --navy: #0E1B2C; --navy-2: #16273D; --gold: #C8A862; --gold-soft: #E3CE9C;
    --cream: #F4EFE6; --muted: #9FB0C4; --up: #6FCF97; --down: #C99A9A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; height: 100%; overflow: hidden; }

  .stage {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 1080px; height: 1920px; transform-origin: center center;
    background: radial-gradient(120% 80% at 50% 0%, var(--navy-2) 0%, var(--navy) 55%, #0A1422 100%);
    color: var(--cream); font-family: 'Inter', sans-serif; overflow: hidden;
  }
  .bg-drift {
    position: absolute; inset: -10%;
    background:
      radial-gradient(40% 30% at 20% 20%, rgba(200,168,98,0.10), transparent 60%),
      radial-gradient(45% 35% at 80% 80%, rgba(200,168,98,0.08), transparent 60%);
    animation: drift 24s ease-in-out infinite alternate;
  }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(-3%, -2%) scale(1.08); } }

  .frame { position: absolute; inset: 48px; pointer-events: none; }
  .corner { position: absolute; width: 70px; height: 70px; border-color: var(--gold); opacity: 0.7; }
  .corner.tl { top: 0; left: 0; border-left: 2px solid; border-top: 2px solid; }
  .corner.tr { top: 0; right: 0; border-right: 2px solid; border-top: 2px solid; }
  .corner.bl { bottom: 0; left: 0; border-left: 2px solid; border-bottom: 2px solid; }
  .corner.br { bottom: 0; right: 0; border-right: 2px solid; border-bottom: 2px solid; }

  .brand { position: absolute; top: 92px; left: 0; right: 0; text-align: center; z-index: 5; }
  .brand .name { font-family: 'Cormorant Garamond', serif; font-size: 40px; letter-spacing: 10px; color: var(--cream); text-transform: uppercase; }
  .brand .sub { font-size: 15px; letter-spacing: 6px; color: var(--gold); text-transform: uppercase; margin-top: 8px; }
  .footer { position: absolute; bottom: 96px; left: 0; right: 0; text-align: center; z-index: 5; font-size: 16px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; }

  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 110px; text-align: center; opacity: 0; }
  .kicker { font-size: 20px; letter-spacing: 8px; text-transform: uppercase; color: var(--gold); margin-bottom: 26px; }
  .headline { font-family: 'Cormorant Garamond', serif; font-weight: 600; line-height: 1.05; color: var(--cream); }

  .hook .headline { font-size: 108px; }
  .hook .areas { margin-top: 40px; font-size: 30px; letter-spacing: 2px; color: var(--gold-soft); line-height: 1.7; }

  .area-name { font-family: 'Cormorant Garamond', serif; font-size: 84px; font-weight: 600; color: var(--cream); }
  .area-line { width: 90px; height: 2px; background: var(--gold); margin: 26px auto 44px; }
  .price { font-family: 'Cormorant Garamond', serif; font-size: 132px; font-weight: 700; color: var(--gold-soft); line-height: 1; }
  .price-label { font-size: 20px; letter-spacing: 6px; text-transform: uppercase; color: var(--muted); margin-top: 14px; }
  .substats { display: flex; gap: 70px; margin-top: 60px; justify-content: center; }
  .substat .v { font-size: 52px; font-weight: 600; color: var(--cream); }
  .substat .v.up { color: var(--up); }
  .substat .v.down { color: var(--down); }
  .substat .l { font-size: 17px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-top: 10px; }

  .cta .headline { font-size: 92px; }
  .cta .body { margin-top: 36px; font-size: 30px; color: var(--gold-soft); line-height: 1.5; max-width: 740px; }
  .cta .pill { margin-top: 54px; border: 2px solid var(--gold); color: var(--cream); padding: 22px 46px; border-radius: 999px; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; }

  .progress { position: absolute; bottom: 0; left: 0; height: 6px; background: var(--gold); width: 0; animation: prog var(--total, 36s) linear infinite; z-index: 6; }
  @keyframes prog { from { width: 0; } to { width: 100%; } }

  .hook { animation: showHook 36s ease-in-out infinite; }
  .s1   { animation: showS1 36s ease-in-out infinite; }
  .s2   { animation: showS2 36s ease-in-out infinite; }
  .s3   { animation: showS3 36s ease-in-out infinite; }
  .cta  { animation: showCTA 36s ease-in-out infinite; }

  @keyframes showHook { 0% {opacity:0; transform:scale(1.04)} 2% {opacity:1; transform:scale(1)} 10% {opacity:1} 12% {opacity:0} 100% {opacity:0} }
  @keyframes showS1   { 0%,10% {opacity:0} 13% {opacity:1} 34% {opacity:1} 37% {opacity:0} 100% {opacity:0} }
  @keyframes showS2   { 0%,35% {opacity:0} 38% {opacity:1} 59% {opacity:1} 62% {opacity:0} 100% {opacity:0} }
  @keyframes showS3   { 0%,60% {opacity:0} 63% {opacity:1} 84% {opacity:1} 87% {opacity:0} 100% {opacity:0} }
  @keyframes showCTA  { 0%,85% {opacity:0} 88% {opacity:1} 99% {opacity:1} 100% {opacity:0} }

  /* Recording controls (auto-hide; not part of the reel) */
  .controls {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; gap: 10px; align-items: center;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
    padding: 8px 12px; border-radius: 999px; transition: opacity .4s; font-family: 'Inter', sans-serif;
  }
  .controls.hidden { opacity: 0; pointer-events: none; }
  .controls button { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; font-size: 13px; padding: 7px 16px; border-radius: 999px; cursor: pointer; }
  .controls button:hover { background: rgba(255,255,255,0.14); }
  .hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.45); font: 11px 'Inter', sans-serif; z-index: 50; transition: opacity .4s; text-align: center; }
  .hint.hidden { opacity: 0; }
</style>
</head>
<body>
  <div class="controls" id="controls">
    <button id="dlBtn">⬇ Download this reel</button>
    <button id="hideBtn">Hide for recording</button>
  </div>
  <div class="hint" id="hint">Controls auto-hide after a few seconds. Fullscreen + screen-record one loop (~36s).</div>

  <div class="stage" id="stage">
    <div class="bg-drift"></div>
    <div class="frame"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div></div>

    <div class="brand">
      <div class="name">The Elli Group</div>
      <div class="sub">Sotheby's International Realty</div>
    </div>

    <section class="scene hook">
      <div class="kicker">East Side Market Update</div>
      <h1 class="headline">Where the<br/>market stands.</h1>
      <div class="areas" id="hookAreas"></div>
    </section>

    <section class="scene s1" id="scene1"></section>
    <section class="scene s2" id="scene2"></section>
    <section class="scene s3" id="scene3"></section>

    <section class="scene cta">
      <h1 class="headline">Your home<br/>is not the median.</h1>
      <p class="body" id="ctaBody"></p>
      <div class="pill" id="ctaPill"></div>
    </section>

    <div class="footer" id="footer"></div>
    <div class="progress"></div>
  </div>

<script>
  /* =========================================================================
     CONFIG. Real figures from Redfin (spring 2026). Update monthly and
     confirm against Yes-MLS before posting (small suburbs are volatile).
     ========================================================================= */
  const CONFIG = {
    monthLabel: 'SPRING 2026',
    cta: {
      body: 'Comment WORTH and I will run what your specific home would sell for today. No obligation.',
      pill: 'Comment "WORTH"',
    },
    areas: [
      { name: 'Highland Heights', price: '$515,000', change: '+25.6%', changeDir: 'up',   days: '36' }, // Redfin, Feb 2026
      { name: 'Pepper Pike',      price: '$835,000', change: '+4%',    changeDir: 'up',   days: '32' }, // Redfin Mar 2026 / 12-mo
      { name: 'Willoughby',       price: '$277,000', change: '-2%',    changeDir: 'down', days: '32' }, // Redfin 2026
    ],
  };

  document.getElementById('footer').textContent = CONFIG.monthLabel + '  ·  Highland Heights · Pepper Pike · Willoughby';
  document.getElementById('hookAreas').innerHTML = CONFIG.areas.map((a) => a.name).join('<br/>');
  document.getElementById('ctaBody').textContent = CONFIG.cta.body;
  document.getElementById('ctaPill').textContent = CONFIG.cta.pill;

  function statScene(a) {
    return `
      <div>
        <div class="kicker">${CONFIG.monthLabel}</div>
        <div class="area-name">${a.name}</div>
        <div class="area-line"></div>
        <div class="price">${a.price}</div>
        <div class="price-label">Median Sale Price</div>
        <div class="substats">
          <div class="substat"><div class="v ${a.changeDir}">${a.change}</div><div class="l">vs last year</div></div>
          <div class="substat"><div class="v">${a.days}</div><div class="l">days on market</div></div>
        </div>
      </div>`;
  }
  document.getElementById('scene1').innerHTML = statScene(CONFIG.areas[0]);
  document.getElementById('scene2').innerHTML = statScene(CONFIG.areas[1]);
  document.getElementById('scene3').innerHTML = statScene(CONFIG.areas[2]);

  document.documentElement.style.setProperty('--total', '36s');

  function fit() {
    const s = document.getElementById('stage');
    const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    s.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  window.addEventListener('resize', fit);
  fit();

  // ---- Recording controls: auto-hide, download ----
  const controls = document.getElementById('controls');
  const hint = document.getElementById('hint');
  let hideTimer;
  function showControls() {
    controls.classList.remove('hidden');
    hint.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => { controls.classList.add('hidden'); hint.classList.add('hidden'); }, 5000);
  }
  window.addEventListener('mousemove', showControls);
  window.addEventListener('touchstart', showControls, { passive: true });
  showControls();

  document.getElementById('hideBtn').onclick = () => {
    controls.classList.add('hidden'); hint.classList.add('hidden'); clearTimeout(hideTimer);
  };
  document.getElementById('dlBtn').onclick = async () => {
    try {
      const res = await fetch(location.href, { cache: 'no-store' });
      const text = await res.text();
      const blob = new Blob([text], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'elli-market-update-reel.html'; a.click();
      URL.revokeObjectURL(url);
    } catch (e) {
      alert('Download could not fetch the file. Use your browser Save Page (Ctrl/Cmd + S) instead.');
    }
  };
</script>
</body>
</html>
