<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elli Group — Market Update</title>
<style>
  /* Page chrome (not exported) */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0A1422; color: #F4EFE6; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }
  .tabs { display: flex; gap: 6px; justify-content: center; padding: 16px 16px 0; }
  .tabs button { background: transparent; border: none; color: #9FB0C4; font-size: 15px; font-weight: 600; padding: 10px 22px; border-radius: 10px 10px 0 0; cursor: pointer; }
  .tabs button.active { color: #0A1422; background: #C8A862; }
  .bar {
    position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center;
    padding: 16px; background: rgba(10,20,34,0.9); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(200,168,98,0.25);
  }
  .group { display: flex; gap: 6px; background: rgba(255,255,255,0.06); border-radius: 999px; padding: 4px; }
  .bar button { border: 1px solid transparent; background: transparent; color: #F4EFE6; font-size: 14px; font-weight: 600; padding: 9px 18px; border-radius: 999px; cursor: pointer; transition: all .15s; }
  .group button.active { background: #C8A862; color: #0A1422; }
  .dl { border: 1px solid #C8A862; color: #C8A862; }
  .dl:hover { background: #C8A862; color: #0A1422; }
  .dl:disabled { opacity: 0.5; cursor: default; }
  .note { text-align: center; font-size: 12px; color: #9FB0C4; padding: 12px 16px 0; min-height: 18px; }

  /* Images tab */
  .cards { display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 28px 16px 60px; }
  .card-wrap { position: relative; }
  .card-wrap .dlone { position: absolute; top: 10px; right: 10px; z-index: 5; font-size: 12px; font-weight: 600; background: rgba(10,20,34,0.85); color: #C8A862; border: 1px solid #C8A862; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .card-wrap .dlone:hover { background: #C8A862; color: #0A1422; }

  /* Video tab */
  .stage { display: flex; justify-content: center; padding: 24px 16px 60px; }
  #cv { max-height: 72vh; max-width: 92vw; height: auto; width: auto; border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }

  /* =========================================================================
     CARD STYLES (exported as PNG). Edit numbers in the CONFIG block below.
     System fonts only, so PNG export renders correctly.
     ========================================================================= */
  .card { position: relative; width: 1080px; background: radial-gradient(120% 80% at 50% 0%, #16273D 0%, #0E1B2C 55%, #0A1422 100%); color: #F4EFE6; overflow: hidden; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .card.vertical { height: 1920px; }
  .card.square { height: 1080px; }
  .card .frame { position: absolute; inset: 44px; pointer-events: none; }
  .card .corner { position: absolute; width: 64px; height: 64px; border-color: #C8A862; opacity: 0.75; }
  .card .corner.tl { top: 0; left: 0; border-left: 2px solid; border-top: 2px solid; }
  .card .corner.tr { top: 0; right: 0; border-right: 2px solid; border-top: 2px solid; }
  .card .corner.bl { bottom: 0; left: 0; border-left: 2px solid; border-bottom: 2px solid; }
  .card .corner.br { bottom: 0; right: 0; border-right: 2px solid; border-bottom: 2px solid; }
  .card .brand { position: absolute; left: 0; right: 0; text-align: center; }
  .card.vertical .brand { top: 90px; }
  .card.square .brand { top: 56px; }
  .card .brand .name { font-family: Georgia, 'Times New Roman', serif; letter-spacing: 9px; color: #F4EFE6; text-transform: uppercase; }
  .card.vertical .brand .name { font-size: 40px; }
  .card.square .brand .name { font-size: 32px; }
  .card .brand .sub { letter-spacing: 6px; color: #C8A862; text-transform: uppercase; margin-top: 8px; }
  .card.vertical .brand .sub { font-size: 15px; }
  .card.square .brand .sub { font-size: 13px; }
  .card .footer { position: absolute; left: 0; right: 0; text-align: center; color: #9FB0C4; letter-spacing: 3px; text-transform: uppercase; }
  .card.vertical .footer { bottom: 92px; font-size: 16px; }
  .card.square .footer { bottom: 52px; font-size: 13px; }
  .card .body { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 110px; }
  .card.square .body { padding: 0 90px; }
  .card .kicker { letter-spacing: 8px; text-transform: uppercase; color: #C8A862; }
  .card.vertical .kicker { font-size: 20px; margin-bottom: 26px; }
  .card.square .kicker { font-size: 16px; margin-bottom: 18px; }
  .card .headline { font-family: Georgia, 'Times New Roman', serif; font-weight: 600; line-height: 1.06; color: #F4EFE6; }
  .card.vertical .headline { font-size: 104px; }
  .card.square .headline { font-size: 70px; }
  .card .areas { color: #E3CE9C; line-height: 1.7; }
  .card.vertical .areas { font-size: 30px; margin-top: 40px; }
  .card.square .areas { font-size: 24px; margin-top: 26px; line-height: 1.6; }
  .card .area-name { font-family: Georgia, 'Times New Roman', serif; font-weight: 600; color: #F4EFE6; }
  .card.vertical .area-name { font-size: 82px; }
  .card.square .area-name { font-size: 58px; }
  .card .area-line { height: 2px; background: #C8A862; }
  .card.vertical .area-line { width: 90px; margin: 26px auto 44px; }
  .card.square .area-line { width: 76px; margin: 18px auto 30px; }
  .card .price { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; color: #E3CE9C; line-height: 1; }
  .card.vertical .price { font-size: 128px; }
  .card.square .price { font-size: 92px; }
  .card .price-label { letter-spacing: 6px; text-transform: uppercase; color: #9FB0C4; }
  .card.vertical .price-label { font-size: 20px; margin-top: 14px; }
  .card.square .price-label { font-size: 16px; margin-top: 10px; }
  .card .substats { display: flex; justify-content: center; }
  .card.vertical .substats { gap: 70px; margin-top: 58px; }
  .card.square .substats { gap: 50px; margin-top: 40px; }
  .card .substat .v { font-weight: 600; color: #F4EFE6; }
  .card.vertical .substat .v { font-size: 52px; }
  .card.square .substat .v { font-size: 40px; }
  .card .substat .v.up { color: #6FCF97; }
  .card .substat .v.down { color: #C99A9A; }
  .card .substat .l { letter-spacing: 3px; text-transform: uppercase; color: #9FB0C4; }
  .card.vertical .substat .l { font-size: 17px; margin-top: 10px; }
  .card.square .substat .l { font-size: 14px; margin-top: 8px; }
  .card .cta-body { color: #E3CE9C; line-height: 1.5; }
  .card.vertical .cta-body { font-size: 30px; margin-top: 36px; max-width: 740px; }
  .card.square .cta-body { font-size: 22px; margin-top: 24px; max-width: 620px; }
  .card .pill { border: 2px solid #C8A862; color: #F4EFE6; border-radius: 999px; letter-spacing: 3px; text-transform: uppercase; display: inline-block; }
  .card.vertical .pill { font-size: 26px; padding: 22px 46px; margin-top: 52px; }
  .card.square .pill { font-size: 20px; padding: 16px 34px; margin-top: 34px; }
</style>
</head>
<body>
  <div class="tabs" id="tabs">
    <button data-tab="images" class="active">Images</button>
    <button data-tab="video">Video</button>
  </div>

  <!-- IMAGES TAB ---------------------------------------------------------- -->
  <section id="tab-images">
    <div class="bar">
      <div class="group" id="imgFmt">
        <button data-fmt="square" class="active">Feed 1:1</button>
        <button data-fmt="vertical">Story 9:16</button>
      </div>
      <button class="dl" id="dlAll">⬇ Download all cards</button>
    </div>
    <p class="note" id="imgNote"></p>
    <div class="cards" id="cards"></div>
  </section>

  <!-- VIDEO TAB ----------------------------------------------------------- -->
  <section id="tab-video" hidden>
    <div class="bar">
      <div class="group" id="vidFmt">
        <button data-fmt="vertical" class="active">Reel 9:16</button>
        <button data-fmt="square">Feed 1:1</button>
      </div>
      <button class="dl" id="recBtn">● Record video</button>
    </div>
    <p class="note" id="vidNote">Plays a ~25s loop. Hit record and it captures one clean loop, then downloads.</p>
    <div class="stage"><canvas id="cv" width="1080" height="1920"></canvas></div>
  </section>

<script>
  /* =========================================================================
     CONFIG. Real figures from Redfin (spring 2026). Update monthly and
     confirm against Yes-MLS before posting (small suburbs are volatile).
     ========================================================================= */
  const CONFIG = {
    monthLabel: 'SPRING 2026',
    cta: { body: 'Comment WORTH and I will run what your specific home would sell for today. No obligation.', pill: 'Comment "WORTH"' },
    areas: [
      { name: 'Highland Heights', price: '$515,000', change: '+25.6%', changeDir: 'up',   days: '36' },
      { name: 'Pepper Pike',      price: '$835,000', change: '+4%',    changeDir: 'up',   days: '32' },
      { name: 'Willoughby',       price: '$277,000', change: '-2%',    changeDir: 'down', days: '32' },
    ],
  };
  const FOOTER_TEXT = CONFIG.monthLabel + ' · Highland Heights · Pepper Pike · Willoughby';

  /* ===================== TAB SWITCHING ===================== */
  let videoRunning = false;
  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('button'); if (!btn) return;
    const tab = btn.dataset.tab;
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('active', b === btn));
    document.getElementById('tab-images').hidden = tab !== 'images';
    document.getElementById('tab-video').hidden = tab !== 'video';
    if (tab === 'video') startVideo(); else stopVideo();
  });

  /* ============================================================
     IMAGES: 5 cards exported as full-res PNG (DOM -> SVG -> PNG)
     ============================================================ */
  let imgFormat = 'square';
  const brand = `<div class="brand"><div class="name">The Elli Group</div><div class="sub">Sotheby's International Realty</div></div>`;
  const cornerFrame = `<div class="frame"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div></div>`;
  const footer = `<div class="footer">${FOOTER_TEXT}</div>`;
  function hookCard() { return `${cornerFrame}${brand}<div class="body"><div class="kicker">East Side Market Update</div><div class="headline">Where the<br/>market stands.</div><div class="areas">${CONFIG.areas.map((a)=>a.name).join('<br/>')}</div></div>${footer}`; }
  function statCard(a) { return `${cornerFrame}${brand}<div class="body"><div class="kicker">${CONFIG.monthLabel}</div><div class="area-name">${a.name}</div><div class="area-line"></div><div class="price">${a.price}</div><div class="price-label">Median Sale Price</div><div class="substats"><div class="substat"><div class="v ${a.changeDir}">${a.change}</div><div class="l">vs last year</div></div><div class="substat"><div class="v">${a.days}</div><div class="l">days on market</div></div></div></div>${footer}`; }
  function ctaCard() { return `${cornerFrame}${brand}<div class="body"><div class="headline">Your home<br/>is not the median.</div><div class="cta-body">${CONFIG.cta.body}</div><div class="pill">${CONFIG.cta.pill}</div></div>${footer}`; }
  const SLIDES = [
    { name: '1-hook', html: hookCard() },
    { name: '2-highland-heights', html: statCard(CONFIG.areas[0]) },
    { name: '3-pepper-pike', html: statCard(CONFIG.areas[1]) },
    { name: '4-willoughby', html: statCard(CONFIG.areas[2]) },
    { name: '5-cta', html: ctaCard() },
  ];
  const CARD_CSS = Array.from(document.styleSheets[0].cssRules).map((r) => r.cssText).join('\n');

  function renderImages() {
    const container = document.getElementById('cards');
    container.innerHTML = '';
    const previewW = Math.min(380, window.innerWidth - 40);
    const scale = previewW / 1080;
    const fullH = imgFormat === 'square' ? 1080 : 1920;
    SLIDES.forEach((slide) => {
      const wrap = document.createElement('div');
      wrap.className = 'card-wrap';
      wrap.style.width = previewW + 'px';
      wrap.style.height = (fullH * scale) + 'px';
      const card = document.createElement('div');
      card.className = 'card ' + imgFormat;
      card.innerHTML = slide.html;
      card.style.transformOrigin = 'top left';
      card.style.transform = `scale(${scale})`;
      card.style.position = 'absolute'; card.style.top = '0'; card.style.left = '0';
      const dl = document.createElement('button');
      dl.className = 'dlone'; dl.textContent = '⬇'; dl.title = 'Download this card';
      dl.onclick = () => exportCard(card, `elli-${imgFormat}-${slide.name}.png`);
      wrap.appendChild(card); wrap.appendChild(dl); container.appendChild(wrap);
    });
    document.getElementById('imgNote').textContent = imgFormat === 'square'
      ? 'Feed 1:1. Download all 5 and post as a carousel (swipe post).'
      : 'Story 9:16. Download all 5 and post as a story sequence.';
  }
  async function exportCard(cardEl, filename) {
    const SCALE = 2; // export at 2x for 4K-class resolution (2160 wide)
    const w = 1080, h = imgFormat === 'square' ? 1080 : 1920;
    const clone = cardEl.cloneNode(true);
    clone.style.transform = 'none'; clone.style.position = 'static';
    const xml = new XMLSerializer().serializeToString(clone);
    // viewBox keeps the 1080-space layout, but the SVG rasterizes at 2x so text
    // and vectors stay crisp (this is a true re-render, not an upscaled blur).
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w * SCALE}" height="${h * SCALE}" viewBox="0 0 ${w} ${h}"><foreignObject x="0" y="0" width="${w}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml"><style>${CARD_CSS}</style>${xml}</div></foreignObject></svg>`;
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
    const canvas = document.createElement('canvas'); canvas.width = w * SCALE; canvas.height = h * SCALE;
    canvas.getContext('2d').drawImage(img, 0, 0, w * SCALE, h * SCALE);
    await new Promise((res) => canvas.toBlob((blob) => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000); res();
    }, 'image/png'));
  }
  async function downloadAllImages() {
    const cards = document.querySelectorAll('#cards .card');
    for (let i = 0; i < cards.length; i++) { await exportCard(cards[i], `elli-${imgFormat}-${SLIDES[i].name}.png`); await new Promise((r) => setTimeout(r, 400)); }
  }
  document.getElementById('imgFmt').addEventListener('click', (e) => {
    const btn = e.target.closest('button'); if (!btn) return;
    imgFormat = btn.dataset.fmt;
    document.querySelectorAll('#imgFmt button').forEach((b) => b.classList.toggle('active', b === btn));
    renderImages();
  });
  document.getElementById('dlAll').onclick = downloadAllImages;

  /* ============================================================
     VIDEO: canvas animation recorded to a downloadable file.
     ============================================================ */
  const SERIF = "Georgia, 'Times New Roman', serif";
  const SANS = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
  const SCENE_MS = 5000, FADE_MS = 500;
  const SCENES = [
    { type: 'hook' },
    { type: 'stat', area: CONFIG.areas[0] },
    { type: 'stat', area: CONFIG.areas[1] },
    { type: 'stat', area: CONFIG.areas[2] },
    { type: 'cta' },
  ];
  const LOOP_MS = SCENE_MS * SCENES.length;
  const FMT = {
    vertical: { w:1080, h:1920, brandTop:90, brandName:40, brandNameLS:9, brandSub:15, brandSubLS:6, footerBottom:92, footerSize:16, footerLS:3,
      kicker:20, kickerLS:8, head:104, areas:30, areasLH:1.7, areaName:82, lineW:90, price:128, priceLabel:20, priceLabelLS:6,
      subV:52, subL:17, subLS:3, subGap:70, ctaBody:30, ctaMaxW:740, pill:26, pillPadX:46, pillPadY:22, pillLS:3,
      gKickerHead:26, gHeadAreas:40, gNameLine:26, gLinePrice:44, gPriceLabel:14, gSubstats:58, gCtaBody:36, gPill:52, corner:64 },
    square: { w:1080, h:1080, brandTop:56, brandName:32, brandNameLS:9, brandSub:13, brandSubLS:6, footerBottom:52, footerSize:13, footerLS:3,
      kicker:16, kickerLS:8, head:70, areas:24, areasLH:1.6, areaName:58, lineW:76, price:92, priceLabel:16, priceLabelLS:6,
      subV:40, subL:14, subLS:3, subGap:50, ctaBody:22, ctaMaxW:620, pill:20, pillPadX:34, pillPadY:16, pillLS:3,
      gKickerHead:18, gHeadAreas:26, gNameLine:18, gLinePrice:30, gPriceLabel:10, gSubstats:40, gCtaBody:24, gPill:34, corner:54 },
  };
  let vidFormat = 'vertical';
  let clockStart = 0, raf = 0;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  function setLS(v) { try { ctx.letterSpacing = v + 'px'; } catch (e) {} }
  function font(weight, size, family) { ctx.font = `${weight} ${size}px ${family}`; }
  function line(text, cx, top, o) {
    font(o.weight || 400, o.size, o.family || SANS); setLS(o.ls || 0);
    ctx.fillStyle = o.color; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(o.upper ? text.toUpperCase() : text, cx, top); setLS(0);
  }
  function wrapLines(text, maxW) {
    const words = text.split(' '); const lines = []; let cur = '';
    for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
    if (cur) lines.push(cur); return lines;
  }
  function roundRect(x, y, w, h, r) {
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawBg(f) {
    const g = ctx.createRadialGradient(f.w / 2, -f.h * 0.1, 0, f.w / 2, 0, f.h * 1.05);
    g.addColorStop(0, '#16273D'); g.addColorStop(0.55, '#0E1B2C'); g.addColorStop(1, '#0A1422');
    ctx.fillStyle = g; ctx.fillRect(0, 0, f.w, f.h);
  }
  function drawCorners(f) {
    const inset = 44, len = f.corner;
    ctx.strokeStyle = 'rgba(200,168,98,0.75)'; ctx.lineWidth = 2;
    const L = (a, b, c, d, e, g2) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, g2); ctx.stroke(); };
    L(inset, inset + len, inset, inset, inset + len, inset);
    L(f.w - inset - len, inset, f.w - inset, inset, f.w - inset, inset + len);
    L(inset, f.h - inset - len, inset, f.h - inset, inset + len, f.h - inset);
    L(f.w - inset - len, f.h - inset, f.w - inset, f.h - inset, f.w - inset, f.h - inset - len);
  }
  function drawBrand(f) {
    line('The Elli Group', f.w / 2, f.brandTop, { weight: 600, size: f.brandName, family: SERIF, color: '#F4EFE6', ls: f.brandNameLS, upper: true });
    line("Sotheby's International Realty", f.w / 2, f.brandTop + f.brandName + 8, { size: f.brandSub, color: '#C8A862', ls: f.brandSubLS, upper: true });
  }
  function drawFooter(f) {
    font(400, f.footerSize, SANS); setLS(f.footerLS); ctx.fillStyle = '#9FB0C4'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(FOOTER_TEXT.toUpperCase(), f.w / 2, f.h - f.footerBottom); setLS(0);
  }
  const block = (mt, h, draw) => ({ mt, h, draw });
  function buildBlocks(f, scene) {
    if (scene.type === 'hook') {
      return [
        block(0, f.kicker, (x, y) => line('East Side Market Update', x, y, { size: f.kicker, color: '#C8A862', ls: f.kickerLS, upper: true })),
        block(f.gKickerHead, f.head * 1.06 * 2, (x, y) => { line('Where the', x, y, { weight: 600, size: f.head, family: SERIF, color: '#F4EFE6' }); line('market stands.', x, y + f.head * 1.06, { weight: 600, size: f.head, family: SERIF, color: '#F4EFE6' }); }),
        block(f.gHeadAreas, f.areas * f.areasLH * 3, (x, y) => { CONFIG.areas.forEach((a, i) => line(a.name, x, y + i * f.areas * f.areasLH, { size: f.areas, color: '#E3CE9C' })); }),
      ];
    }
    if (scene.type === 'stat') {
      const a = scene.area;
      const col = a.changeDir === 'up' ? '#6FCF97' : a.changeDir === 'down' ? '#C99A9A' : '#F4EFE6';
      return [
        block(0, f.kicker, (x, y) => line(CONFIG.monthLabel, x, y, { size: f.kicker, color: '#C8A862', ls: f.kickerLS, upper: true })),
        block(f.gKickerHead, f.areaName, (x, y) => line(a.name, x, y, { weight: 600, size: f.areaName, family: SERIF, color: '#F4EFE6' })),
        block(f.gNameLine, 2, (x, y) => { ctx.fillStyle = '#C8A862'; ctx.fillRect(x - f.lineW / 2, y, f.lineW, 2); }),
        block(f.gLinePrice, f.price, (x, y) => line(a.price, x, y, { weight: 700, size: f.price, family: SERIF, color: '#E3CE9C' })),
        block(f.gPriceLabel, f.priceLabel, (x, y) => line('Median Sale Price', x, y, { size: f.priceLabel, color: '#9FB0C4', ls: f.priceLabelLS, upper: true })),
        block(f.gSubstats, f.subV + 8 + f.subL, (x, y) => {
          font(600, f.subV, SANS); const v1w = ctx.measureText(a.change).width, v2w = ctx.measureText(a.days).width;
          font(400, f.subL, SANS); setLS(f.subLS); const l1w = ctx.measureText('VS LAST YEAR').width, l2w = ctx.measureText('DAYS ON MARKET').width; setLS(0);
          const c1 = Math.max(v1w, l1w), c2 = Math.max(v2w, l2w);
          const x1 = x - (f.subGap / 2 + c1 / 2), x2 = x + (f.subGap / 2 + c2 / 2);
          line(a.change, x1, y, { weight: 600, size: f.subV, color: col });
          line('vs last year', x1, y + f.subV + 8, { size: f.subL, color: '#9FB0C4', ls: f.subLS, upper: true });
          line(a.days, x2, y, { weight: 600, size: f.subV, color: '#F4EFE6' });
          line('days on market', x2, y + f.subV + 8, { size: f.subL, color: '#9FB0C4', ls: f.subLS, upper: true });
        }),
      ];
    }
    // cta
    font(400, f.ctaBody, SANS); const lines = wrapLines(CONFIG.cta.body, f.ctaMaxW);
    return [
      block(0, f.head * 1.06 * 2, (x, y) => { line('Your home', x, y, { weight: 600, size: f.head, family: SERIF, color: '#F4EFE6' }); line('is not the median.', x, y + f.head * 1.06, { weight: 600, size: f.head, family: SERIF, color: '#F4EFE6' }); }),
      block(f.gCtaBody, lines.length * f.ctaBody * 1.5, (x, y) => { lines.forEach((ln, i) => line(ln, x, y + i * f.ctaBody * 1.5, { size: f.ctaBody, color: '#E3CE9C' })); }),
      block(f.gPill, f.pill + 2 * f.pillPadY, (x, y) => {
        const text = CONFIG.cta.pill.toUpperCase();
        font(400, f.pill, SANS); setLS(f.pillLS); const tw = ctx.measureText(text).width;
        const rw = tw + 2 * f.pillPadX, rh = f.pill + 2 * f.pillPadY, rx = x - rw / 2;
        ctx.strokeStyle = '#C8A862'; ctx.lineWidth = 2; roundRect(rx, y, rw, rh, rh / 2); ctx.stroke();
        ctx.fillStyle = '#F4EFE6'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y + rh / 2 + 1); setLS(0);
        ctx.textBaseline = 'top';
      }),
    ];
  }
  function drawScene(f, scene, alpha) {
    const blocks = buildBlocks(f, scene);
    let total = 0; for (const b of blocks) total += b.mt + b.h;
    let y = (f.h - total) / 2;
    ctx.save(); ctx.globalAlpha = alpha;
    for (const b of blocks) { y += b.mt; b.draw(f.w / 2, y); y += b.h; }
    ctx.restore();
  }
  function renderAt(f, elapsed) {
    ctx.setTransform(VID_SCALE, 0, 0, VID_SCALE, 0, 0); // draw in 1080-space onto a 2x (4K) canvas
    drawBg(f); drawCorners(f); drawBrand(f); drawFooter(f);
    const e = ((elapsed % LOOP_MS) + LOOP_MS) % LOOP_MS;
    const idx = Math.floor(e / SCENE_MS);
    const within = e - idx * SCENE_MS;
    let a = 1;
    if (within < FADE_MS) a = within / FADE_MS;
    else if (within > SCENE_MS - FADE_MS) a = (SCENE_MS - within) / FADE_MS;
    drawScene(f, SCENES[idx], a);
  }
  function frame() {
    renderAt(FMT[vidFormat], performance.now() - clockStart);
    raf = requestAnimationFrame(frame);
  }
  const VID_SCALE = 2; // render the video canvas at 2x for 4K-class output (2160 wide)
  function setupCanvas() { const f = FMT[vidFormat]; cv.width = f.w * VID_SCALE; cv.height = f.h * VID_SCALE; }
  function startVideo() { if (videoRunning) return; videoRunning = true; setupCanvas(); clockStart = performance.now(); frame(); }
  function stopVideo() { videoRunning = false; if (raf) cancelAnimationFrame(raf); raf = 0; }

  function pickMime() {
    const candidates = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    for (const m of candidates) { if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; }
    return '';
  }
  async function record() {
    const recBtn = document.getElementById('recBtn'); const note = document.getElementById('vidNote');
    if (!window.MediaRecorder || !cv.captureStream) { note.textContent = 'This browser cannot record video. Use the Images tab, or try Chrome/Edge.'; return; }
    const mime = pickMime();
    const ext = mime.indexOf('mp4') !== -1 ? 'mp4' : 'webm';
    const f = FMT[vidFormat];
    // Stop the live preview loop. While recording we drive frames on a fixed
    // clock and push each one with requestFrame, so the capture does not depend
    // on requestAnimationFrame (which pauses if the tab is backgrounded).
    if (raf) cancelAnimationFrame(raf); raf = 0;
    let stream = cv.captureStream(0);
    let track = stream.getVideoTracks()[0];
    const canRequest = track && typeof track.requestFrame === 'function';
    if (!canRequest) { stream = cv.captureStream(30); track = stream.getVideoTracks()[0]; }
    let rec;
    try { rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 40000000 } : { videoBitsPerSecond: 40000000 }); }
    catch (e) { note.textContent = 'Recording failed to start: ' + e.message; clockStart = performance.now(); frame(); return; }
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: mime || 'video/webm' });
      if (!blob.size) {
        note.textContent = 'Recording came back empty. Try Chrome or Edge, or use the Images tab.';
      } else {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `elli-market-update-${vidFormat}.${ext}`; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        note.textContent = ext === 'mp4'
          ? 'Downloaded an MP4. Post straight to Instagram (Reel for 9:16, feed video for 1:1).'
          : 'Downloaded a WebM (your browser does not export MP4). Instagram may need an MP4. Open it in CapCut or any free converter and export MP4, or just use the Images tab.';
      }
      recBtn.disabled = false; recBtn.textContent = '● Record video';
      clockStart = performance.now(); frame(); // resume live preview
    };
    recBtn.disabled = true;
    const STEP = 1000 / 30;
    rec.start(250); // timeslice so data flushes during the capture, not only at stop
    const recStart = performance.now();
    renderAt(f, 0); if (canRequest) track.requestFrame();
    // Drive by real elapsed time (not a fixed per-tick step) so the clip stays
    // real-time-correct and always finishes at LOOP_MS even if timers throttle.
    const iv = setInterval(() => {
      const elapsed = performance.now() - recStart;
      renderAt(f, Math.min(elapsed, LOOP_MS));
      if (canRequest) track.requestFrame();
      recBtn.textContent = `Recording… ${Math.max(0, Math.ceil((LOOP_MS - elapsed) / 1000))}s`;
      if (elapsed >= LOOP_MS) { clearInterval(iv); rec.stop(); }
    }, STEP);
  }
  document.getElementById('vidFmt').addEventListener('click', (e) => {
    const btn = e.target.closest('button'); if (!btn) return;
    vidFormat = btn.dataset.fmt;
    document.querySelectorAll('#vidFmt button').forEach((b) => b.classList.toggle('active', b === btn));
    setupCanvas(); clockStart = performance.now();
  });
  document.getElementById('recBtn').onclick = record;

  window.addEventListener('resize', () => { if (!document.getElementById('tab-images').hidden) renderImages(); });
  renderImages();
</script>
</body>
</html>
